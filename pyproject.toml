[build-system]
requires = ["setuptools>=64", "wheel"]
build-backend = "setuptools.backends._legacy:_Backend"

[project]
name = "idili-predict"
version = "1.0.0"
description = "iDILI-Predict: Morphological profiling for drug-induced liver injury prediction"
readme = "README.md"
license = {text = "MIT"}
requires-python = ">=3.9"
dependencies = [
    "autogluon[tabular]",
    "pandas",
    "numpy",
    "scipy",
    "scikit-learn",
    "pycytominer",
    "tqdm",
]

[project.optional-dependencies]
notebooks = [
    "umap-learn",
    "scanpy",
    "harmonypy",
    "matplotlib",
    "jupyter",
    "anndata",
]

[project.scripts]
idili-predict = "idili_predict.cli:main"
